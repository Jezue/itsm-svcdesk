services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]

volumes:
  svcdesk-data:
